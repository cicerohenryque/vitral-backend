spring.application.name=vitral-backend

# ===== BANCO DE DADOS =====
spring.datasource.url=jdbc:postgresql://localhost:5432/vitral_db
spring.datasource.username=vitral_user
spring.datasource.password=vitral_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / HIBERNATE =====
# Flyway gerencia o schema; Hibernate apenas valida que o mapeamento bate com o banco.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== FLYWAY =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== SWAGGER / OPENAPI =====
springdoc.swagger-ui.path=/swagger-ui.html

# ===== SERVIDOR =====
server.port=8080

