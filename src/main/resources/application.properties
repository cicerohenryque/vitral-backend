spring.application.name=vitral-backend

# ===== BANCO DE DADOS =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vitral_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:vitral_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / HIBERNATE =====
# Flyway gerencia o schema; Hibernate apenas valida que o mapeamento bate com o banco.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== FLYWAY =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== CORS =====
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:3000,http://127.0.0.1:3000}

# ===== UPLOADS =====
app.upload.image-dir=${APP_UPLOAD_IMAGE_DIR:uploads/images}
app.upload.document-dir=${APP_UPLOAD_DOCUMENT_DIR:uploads/documents}
app.upload.document-max-size-bytes=${APP_UPLOAD_DOCUMENT_MAX_SIZE_BYTES:10485760}
spring.servlet.multipart.max-file-size=${APP_UPLOAD_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${APP_UPLOAD_MAX_REQUEST_SIZE:10MB}

# ===== SWAGGER / OPENAPI =====
springdoc.swagger-ui.path=/swagger-ui.html

# ===== SERVIDOR =====
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===== E-MAIL =====
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.url.base=${APP_URL_BASE:http://localhost:8080}
app.url.frontend=${APP_URL_FRONTEND:http://localhost:5173}
app.support.email=${APP_SUPPORT_EMAIL:vitral.no.reply@gmail.com}

# ===== BOOTSTRAP ADMIN (sem credenciais padrao) =====
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.name=${APP_BOOTSTRAP_ADMIN_NAME:Administrador}

# ===== MOCK TEMPORARIO DE VERIFICACAO DE SEBO =====
# Enquanto nao existe uma conta ADMIN para revisar cadastros manualmente
# (ver VerificacaoSeboService.revisar), o sebo e aprovado (VERIFICADO) automaticamente
# no cadastro/edicao/reenvio de documento. Defina como false assim que houver um ADMIN
# operando, para que o fluxo real de analise manual volte a valer.
app.sebo-verificacao.mock-auto-aprovar=${APP_SEBO_VERIFICACAO_MOCK_AUTO_APROVAR:true}

# ===== CONSULTA CNPJ SERPRO =====
app.cnpj-consulta.enabled=${APP_CNPJ_CONSULTA_ENABLED:false}
app.cnpj-consulta.token-url=${APP_CNPJ_TOKEN_URL:https://gateway.apiserpro.serpro.gov.br/token}
app.cnpj-consulta.consulta-url=${APP_CNPJ_CONSULTA_URL:https://gateway.apiserpro.serpro.gov.br/consulta-cnpj-df/v2/basica/{cnpj}}
app.cnpj-consulta.client-id=${APP_CNPJ_CLIENT_ID:}
app.cnpj-consulta.client-secret=${APP_CNPJ_CLIENT_SECRET:}

# ===== GEOCODING (endereco -> lat/lng via Nominatim/OpenStreetMap, usado para ordenar sebos por proximidade) =====
# A consulta por CEP via BrasilAPI foi trocada pelo Nominatim (busca por endereco completo)
# porque a BrasilAPI vinha retornando "coordinates":{} vazio mesmo para enderecos conhecidos.
app.geocoding.enabled=${APP_GEOCODING_ENABLED:true}
app.geocoding.search-url=${APP_GEOCODING_SEARCH_URL:https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q={q}}
app.geocoding.user-agent=${APP_GEOCODING_USER_AGENT:VitralApp/1.0 (MVP academico UFCG; sem contato publico)}

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:vitral.no.reply@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:gcvjlmovuwlyveez}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_STARTTLS_REQUIRED:true}
