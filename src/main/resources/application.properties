spring.application.name=vitral-backend

# ===== BANCO DE DADOS =====
spring.datasource.url=jdbc:postgresql://localhost:5432/vitral_db
spring.datasource.username=vitral_user
spring.datasource.password=vitral_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===== SERVIDOR =====
server.port=8080

# ===== JWT =====
jwt.secret=vitral_jwt_secret_key_2026
jwt.expiration=86400000