name: Backend CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configurar JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Garantir permissão de execução do Maven Wrapper
        run: chmod +x ./mvnw
      - name: Build e testes
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
      - name: Publicar cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  postgres-integration:
    name: Integração com PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configurar JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Garantir permissão de execução do Maven Wrapper
        run: chmod +x ./mvnw
      - name: Validar filtro geográfico no PostgreSQL
        run: ./mvnw --batch-mode --no-transfer-progress -Ppostgres-it verify
      - name: Publicar relatório de integração
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgres-integration-reports
          path: target/failsafe-reports/
          if-no-files-found: ignore
