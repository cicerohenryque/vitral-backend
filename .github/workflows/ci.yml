name: Backend CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Garantir permissão de execução do Maven Wrapper
        run: chmod +x ./mvnw
      - name: Build e testes
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
      - name: Publicar cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  postgres-integration:
    name: Integração com PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Garantir permissão de execução do Maven Wrapper
        run: chmod +x ./mvnw
      - name: Validar filtro geográfico no PostgreSQL
        run: ./mvnw --batch-mode --no-transfer-progress -Ppostgres-it verify
      - name: Publicar relatório de integração
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-integration-reports
          path: target/failsafe-reports/
          if-no-files-found: ignore
